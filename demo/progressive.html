<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShadowImage — 单码流渐进图片</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark}select{appearance:none}body{margin:0;background:#111722;color:#e6edf5;font:15px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px}h1{margin-bottom:8px}p{color:#b6c4d5;line-height:1.6}.controls{display:flex;gap:12px;flex-wrap:wrap;padding:18px 0}label{display:grid;gap:6px;font-size:13px}select,button{padding:10px;border:1px solid #40506a;border-radius:6px;background:#202d40;color:inherit}button{align-self:end;cursor:pointer}.views{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#1b2534;padding:16px;border-radius:10px}.image{min-height:220px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#cbd0d8 0% 25%,#f2f4f7 0% 50%) 0 /20px 20px}canvas,img{display:block;max-width:100%;max-height:65vh;object-fit:contain}pre{white-space:pre-wrap;color:#9adac9;max-height:240px;overflow:auto;font-size:12px}#status{min-height:24px;color:#b9ddff}@media(max-width:700px){.views{grid-template-columns:1fr}main{padding:16px}}
</style></head><body><main><h1>ShadowImage</h1><p>一份自定义码流，从全图轮廓到完整细节。纯 JS 解码；右侧参考图只用于实验对照，不参与左侧重建。</p>
<div class="controls"><label>真实图片<select id="sample"></select></label><label>最终精度<select id="quality"><option value="">精确 RGBA</option><option value="-lossy">省略 2 位颜色精度</option></select></label><label>服务端发送速率<select id="rate"><option>64</option><option selected>256</option><option>1024</option></select></label><label>执行位置<select id="execution"><option value="auto">自动 Worker / 主线程</option><option value="main">主线程分片</option></select></label><button id="start">开始真实流加载</button><button id="stop">停止</button></div>
<div id="status" role="status">正在读取样本清单…</div><div class="views"><section class="panel"><h2>渐进重建</h2><div class="image"><canvas id="canvas" width="1" height="1"></canvas></div></section><section class="panel"><h2>输入像素参考</h2><div class="image"><img id="reference" alt="输入图像参考"></div></section></div><pre id="log"></pre></main><script type="module" src="/demo/progressive.js"></script></body></html>
