name: Build and verify release artifacts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-image-release
          path: |
            release/*.tgz
            release/*.zip
            release/SHA256SUMS
            release/RELEASE_NOTES.md
